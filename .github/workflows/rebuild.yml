name: Пересборка календаря

on:
  schedule:
    # 03:40 UTC = 06:40 МСК. Минута неровная намеренно — не попадать в пик,
    # когда GitHub запускает всё, что стоит на ровном часе.
    - cron: '40 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

# Пуш от GITHUB_TOKEN не перезапускает workflow, поэтому цикла не будет.
permissions:
  contents: write

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Строгие шаги, но прогон не роняют: их статус виден в API как индикатор
      # здоровья источников. Судьбу сборки решает следующий шаг.
      - name: Источник — футбол (fcdynamo.ru)
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --max-time 60 \
            -o /tmp/feed.ics https://fcdynamo.ru/calendar/dynamo
          test "$(grep -c 'BEGIN:VEVENT' /tmp/feed.ics)" -gt 0

      - name: Источник — хоккей (sports.ru)
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --max-time 60 \
            -o /tmp/games.html https://www.sports.ru/hockey/club/dinamo/calendar/
          grep -q '/hockey/match/' /tmp/games.html

      - name: Собрать календарь
        run: python3 build_calendar.py

      - name: Закоммитить, если что-то поменялось
        run: |
          if git diff --quiet -- dynamo.ics state.json hockey.json; then
            echo "изменений нет — коммит не нужен"
            exit 0
          fi
          git config user.name  "dynamo-calendar bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dynamo.ics state.json hockey.json
          git commit -m "Обновить календарь: $(grep -c 'BEGIN:VEVENT' dynamo.ics) матчей"
          git push
